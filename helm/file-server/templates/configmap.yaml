apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "file-server.fullname" . }}-config
  labels:
    {{- include "file-server.labels" . | nindent 4 }}
data:
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.config.s3ForcePathStyle | quote }}
  APP_BASE_URL: {{ .Values.config.appBaseUrl | quote }}
  UPLOAD_PART_SIZE_MB: {{ .Values.config.uploadPartSizeMb | quote }}
  PRESIGN_EXPIRY_SECONDS: {{ .Values.config.presignExpirySeconds | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
