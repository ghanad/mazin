{{- if and (not .Values.s3.existingSecret) (or .Values.s3.accessKey .Values.s3.secretKey) -}}
# Chart-managed credentials. Prefer an existing Secret instead of values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "file-server.secretName" . }}
  labels:
    {{- include "file-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | required "s3.accessKey or s3.existingSecret is required" | quote }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | required "s3.secretKey or s3.existingSecret is required" | quote }}
{{- end }}
