# Default values for file-server.
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: ghanad/mazin
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - host: files.internal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Non-sensitive app configuration rendered into a ConfigMap (envFrom).
config:
  s3Endpoint: https://s3.internal.example.com
  s3Region: default
  s3Bucket: files
  s3ForcePathStyle: true
  appBaseUrl: https://files.internal.example.com
  uploadPartSizeMb: 64
  presignExpirySeconds: 86400
  logLevel: info

# Credentials. Prefer an existing Secret created out-of-band:
#   kubectl -n <ns> create secret generic file-server-s3 \
#     --from-literal=S3_ACCESS_KEY='...' \
#     --from-literal=S3_SECRET_KEY='...'
# If existingSecret is empty and accessKey/secretKey are set,
# the chart renders its own Secret (do not commit real values).
s3:
  existingSecret: ""
  accessKey: ""
  secretKey: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /api/health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

extraVolumes: []
extraVolumeMounts: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
