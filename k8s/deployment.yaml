apiVersion: v1
kind: Namespace
metadata:
  name: file-server
---
# Non-sensitive configuration. Credentials live in the file-server-s3 Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-server-config
  namespace: file-server
data:
  S3_ENDPOINT: "https://s3.internal.example.com"
  S3_REGION: "default"
  S3_BUCKET: "files"
  S3_FORCE_PATH_STYLE: "true"
  APP_BASE_URL: "https://files.internal.example.com"
  UPLOAD_PART_SIZE_MB: "64"
  PRESIGN_EXPIRY_SECONDS: "86400"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-server
  namespace: file-server
  labels:
    app: file-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: file-server
  template:
    metadata:
      labels:
        app: file-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replace with your registry path.
          image: registry.internal.example.com/file-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: file-server-config
            - secretRef:
                name: file-server-s3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            # Deep check: verifies the S3/RGW backend answers (HeadBucket).
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # The app is stateless: all data lives in Ceph, so no PVCs are needed.
---
apiVersion: v1
kind: Service
metadata:
  name: file-server
  namespace: file-server
  labels:
    app: file-server
spec:
  type: ClusterIP
  selector:
    app: file-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Example ingress (nginx). Adjust host/annotations/TLS to your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: file-server
  namespace: file-server
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # Downloads stream through the app; avoid proxy buffering for large files.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: files.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: file-server
                port:
                  number: 80
