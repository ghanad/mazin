# Example Secret manifest. Do NOT commit real credentials.
#
# Preferred: create the secret imperatively and skip this file entirely:
#
#   kubectl -n file-server create secret generic file-server-s3 \
#     --from-literal=S3_ACCESS_KEY='...' \
#     --from-literal=S3_SECRET_KEY='...'
#
apiVersion: v1
kind: Secret
metadata:
  name: file-server-s3
  namespace: file-server
type: Opaque
stringData:
  S3_ACCESS_KEY: "replace-me"
  S3_SECRET_KEY: "replace-me"
